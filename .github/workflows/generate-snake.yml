name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
          
      # Snake Animation
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Wilfred596
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Commit files to main branch
      - name: Commit and push changes
        run: |
          git config --global user.name "Wilfred596"
          git config --global user.email "Wilfred596@users.noreply.github.com"
          git add dist/*
          git commit -m "chore: update snake animation" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Commit files directly to main branch
      - name: Commit and push changes directly 
        id: push
        run: |
          set +e
          git push origin HEAD:main
          echo "push_result=$?" >> $GITHUB_OUTPUT
          set -e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Commit pull request to main branch
      - name: Create Pull Request if push failed
        if: steps.push.outputs.push_result != '0'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update snake animation"
          branch: update-snake
          title: "Update snake animation"
          body: "Automated update of snake animation."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

          
