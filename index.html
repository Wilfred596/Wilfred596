<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
    <style>
         /* Center the context and add 
      some padding*/
              body {
                  box-sizing: border-box;
                  min-width: 200px;
                  margin: 0 auto;
                  padding:  45px;
                  background-color: #f6f8fa;
              }
              .markdown-body {
                  max-width: 980px;
                  width: 100%;
    }
    </style>
</head>
<body class="markdown-body">

    <h1>Welcome to My GitHub Portfolio Website Page!</h1>

    <div id="readme-container">
        <p>Loading README...</p>
    </div>

    <script>
        // 🧑‍💻 Change this to your GitHub username
        const username = 'Wilfred596'; 
        const readmeContainer = document.getElementById('readme-container');

        fetch(`https://api.github.com/repos/${username}/${username}/readme`, {
            headers: {
                // This header tells the API to return the README rendered as HTML
                'Accept': 'application/vnd.github.html'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to fetch README');
            }
            return response.text(); // Get the response as HTML text
        })
        .then(html => {
            // Put the fetched HTML into our container
            readmeContainer.innerHTML = html;
        })
        .catch(error => {
            console.error('Error fetching README:', error);
            readmeContainer.innerHTML = '<p>Could not load README content. Please try again later.</p>';
        });
    </script>

</body>
</html>
